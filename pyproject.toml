[project]
name = "rl-align-recipes"
version = "0.1.0"
description = "Reproducible RL train–rollout consistency and performance recipes"
requires-python = ">=3.10"

[tool.ruff]
target-version = "py310"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
